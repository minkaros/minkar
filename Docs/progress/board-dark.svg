<text x="42" y="745" font-size="13.5" font-weight="400" fill="#9198a1" text-anchor="start">xHCI interrupt intervals per</text>
<text x="42" y="764" font-size="13.5" font-weight="400" fill="#9198a1" text-anchor="start">speed; works through a KVM ·</text>
<text x="42" y="783" font-size="13.5" font-weight="400" fill="#9198a1" text-anchor="start">3 nov</text>
