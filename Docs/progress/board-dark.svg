<text x="42" y="296" font-size="13.5" font-weight="400" fill="#9198a1" text-anchor="start">one desktop, the pointer</text>
<text x="42" y="315" font-size="13.5" font-weight="400" fill="#9198a1" text-anchor="start">across them, capture,</text>
<text x="42" y="334" font-size="13.5" font-weight="400" fill="#9198a1" text-anchor="start">arrangement, mirroring · 3</text>
