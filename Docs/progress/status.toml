# Minkar's progress data: the single source of Docs/Progress.md,
# Docs/Progress.es.md and the SVGs next to this file. After a change here,
# run "bmake progress" at the top of the tree and commit what it rewrites.
# ROADMAP.md and the plans stay the source of truth: every value here
# summarizes them at the commit named below.
#
# States: done | current (in progress) | partial | todo.
#
# Gates are done or not: a gate is never partial, and "current" marks
# only the next gate on the critical path. Partial work shows on the
# stations.
#
# The metro map is laid out by hand: x is a column in pixels, 1200 wide.
#
# - To add a station to a line, put [label, x, state] in its stations, in
#   order from left to right, 50 to 60 px from its neighbours (move the
#   ones after it if there is no room).
# - To add a line, add a [[line]] block where it goes, top to bottom (each
#   line is a row 64 px below the one before): id, name, a colour from
#   tools/progress/gen.py's THEMES (blue, purple, orange, teal, pink,
#   green, red, brown, slate, gray), doc (its plan, relative to Docs/),
#   doc_es when the plan has a Spanish version with other anchors, and
#   stations.
# - A gate's x is the x of the stations it encloses, on every line in its
#   rows (the lines it needs): it sits where those milestones close. A
#   gate with no rows (M0 to M2) sits over the first line.
# - deps draws "starts after" connectors: [from line, x on that line (the
#   station it starts after), to line], ending at the first station of the
#   second line.
#
# The board keeps the six most recent done items, newest first; the
# commit that closes a milestone updates this file and runs
# "bmake progress" (Docs/CONTRIBUTING.md).

