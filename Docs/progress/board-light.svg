<text x="42" y="138" font-size="15" font-weight="650" fill="#1f2328" text-anchor="start">Copy and paste: pboard,</text>
<text x="42" y="159" font-size="15" font-weight="650" fill="#1f2328" text-anchor="start">pbcopy, pbpaste</text>
<text x="42" y="180" font-size="13.5" font-weight="400" fill="#59636e" text-anchor="start">NSPasteboard on a server,</text>
<text x="42" y="199" font-size="13.5" font-weight="400" fill="#59636e" text-anchor="start">each user&#x27;s own;</text>
<text x="42" y="218" font-size="13.5" font-weight="400" fill="#59636e" text-anchor="start">screencapture to PNG/TIFF · 3</text>
<text x="42" y="237" font-size="13.5" font-weight="400" fill="#59636e" text-anchor="start">nov</text>
<rect x="26" y="270" width="241.5" height="127" rx="8" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><rect x="26" y="270" width="5" height="127" rx="2" fill="#cf222e"/>
<text x="42" y="294" font-size="15" font-weight="650" fill="#1f2328" text-anchor="start">G4 done: the window</text>
<text x="42" y="315" font-size="15" font-weight="650" fill="#1f2328" text-anchor="start">server on Vulkan</text>
<text x="42" y="336" font-size="13.5" font-weight="400" fill="#59636e" text-anchor="start">G4.6 measured: Vulkan apps</text>
<text x="42" y="355" font-size="13.5" font-weight="400" fill="#59636e" text-anchor="start">14x cheaper, 60 Hz, flips at</text>
<text x="42" y="374" font-size="13.5" font-weight="400" fill="#59636e" text-anchor="start">vblank · 3 nov</text>
<rect x="26" y="407" width="241.5" height="127" rx="8" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><rect x="26" y="407" width="5" height="127" rx="2" fill="#0969da"/>
<text x="42" y="431" font-size="15" font-weight="650" fill="#1f2328" text-anchor="start">Mac Pro mouse and</text>
<text x="42" y="452" font-size="15" font-weight="650" fill="#1f2328" text-anchor="start">keyboard</text>
<text x="42" y="473" font-size="13.5" font-weight="400" fill="#59636e" text-anchor="start">xHCI interrupt intervals per</text>
<text x="42" y="492" font-size="13.5" font-weight="400" fill="#59636e" text-anchor="start">speed; works through a KVM ·</text>
<text x="42" y="511" font-size="13.5" font-weight="400" fill="#59636e" text-anchor="start">3 nov</text>
<rect x="26" y="544" width="241.5" height="127" rx="8" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><rect x="26" y="544" width="5" height="127" rx="2" fill="#cf222e"/>
<text x="42" y="568" font-size="15" font-weight="650" fill="#1f2328" text-anchor="start">G4.5: Vulkan apps&#x27; frames</text>
<text x="42" y="589" font-size="15" font-weight="650" fill="#1f2328" text-anchor="start">stay in VRAM</text>
<text x="42" y="610" font-size="13.5" font-weight="400" fill="#59636e" text-anchor="start">CAMetalLayer drawables as</text>
<text x="42" y="629" font-size="13.5" font-weight="400" fill="#59636e" text-anchor="start">window layers, GPU copy,</text>
<text x="42" y="648" font-size="13.5" font-weight="400" fill="#59636e" text-anchor="start">paced at 60 Hz · 3 nov</text>
<rect x="26" y="681" width="241.5" height="127" rx="8" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><rect x="26" y="681" width="5" height="127" rx="2" fill="#cf222e"/>
<text x="42" y="705" font-size="15" font-weight="650" fill="#1f2328" text-anchor="start">G4.4: page flips at the</text>
<text x="42" y="726" font-size="15" font-weight="650" fill="#1f2328" text-anchor="start">vertical blank</text>
<text x="42" y="747" font-size="13.5" font-weight="400" fill="#59636e" text-anchor="start">two frames in VRAM, no</text>
<text x="42" y="766" font-size="13.5" font-weight="400" fill="#59636e" text-anchor="start">tearing, one per refresh · 3</text>
<text x="42" y="785" font-size="13.5" font-weight="400" fill="#59636e" text-anchor="start">nov</text>
<rect x="26" y="818" width="241.5" height="127" rx="8" fill="#ffffff" stroke="#d1d9e0" stroke-width="1"/><rect x="26" y="818" width="5" height="127" rx="2" fill="#cf222e"/>
<text x="42" y="842" font-size="15" font-weight="650" fill="#1f2328" text-anchor="start">Security: GPU buffers and</text>
<text x="42" y="863" font-size="15" font-weight="650" fill="#1f2328" text-anchor="start">IOSurfaces</text>
<text x="42" y="884" font-size="13.5" font-weight="400" fill="#59636e" text-anchor="start">unguessable buffer names; an</text>
<text x="42" y="903" font-size="13.5" font-weight="400" fill="#59636e" text-anchor="start">IOSurface ID alone finds</text>
<text x="42" y="922" font-size="13.5" font-weight="400" fill="#59636e" text-anchor="start">nothing · 3 nov</text>
